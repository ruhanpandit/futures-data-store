[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futures-data-store"
version = "0.1.0"
description = "Market data layer: Databento ingest, Parquet storage, DuckDB queries"
requires-python = ">=3.11"
dependencies = [
    "databento>=0.41",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/futures_data_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99
